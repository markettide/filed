name: Scrape announcements

# Every 30 minutes, around the clock, every day of the week.
#
# Two shapes of run:
#   * the half-hourly ones scrape TODAY only and summarise whatever is new - a
#     warm one takes a couple of minutes, nearly all of it reading PDFs the
#     cache has not seen yet
#   * one run a night, 23:37 IST, rescrapes the whole 7-day window so the
#     dashboard stays complete even if runs were missed
#
# It runs overnight too. The exchanges file little at 3am, so those passes are
# cheap - but filings do appear at odd hours, and a reader opening the site
# before the market does should not be looking at last evening's page.
#
# Summaries, market caps and PDF reads are all cached by filing id, so a repeat
# pass only pays for genuinely new filings.

# NOTE ON RELIABILITY - read this before changing the schedule
#
# GitHub's schedule event is best effort. It is delayed under load and runs are
# dropped entirely; on 2 September 2026 it created 8 of the 34 this cron asked
# for, an average gap of 144 minutes against the 30 requested. Every run it did
# create finished normally in a few minutes. The work was never the problem -
# the runs simply did not exist.
#
# So a run does not scrape once and stop. It scrapes, waits for the next half
# hour, and scrapes again for five hours. The cron then only has to succeed
# occasionally instead of 48 times a day, and whenever one does land the site
# refreshes every 30 minutes for the rest of the afternoon.
#
# There is also an external trigger at web/app/api/cron/scrape, which dispatches
# this workflow through the API - workflow_dispatch starts within seconds and is
# never dropped. It needs a token and a clock to call it; see that file.

on:
  schedule:
    # :07 and :37 of every hour, all 24 of them. Not :00 and :30 - GitHub's
    # documentation says scheduled runs are delayed when load peaks, and load
    # peaks on the hour and the half hour.
    #
    # 18:07 UTC is spelled out on its own line so the job can recognise it:
    # that is the one run a day that rescrapes the full week, and it has to be
    # identifiable from github.event.schedule.
    # Back to every hour at two offsets, after a night that showed why.
    #
    # This was every two hours on the reasoning that the chain keeps the site
    # fresh and the cron only has to restart it. The chain does not always
    # restart: the handover step is skipped when a run is CANCELLED, which is
    # correct - a cancelled run's replacement continues the chain - but leaves
    # nothing behind when a run is cancelled with no replacement coming. That
    # happened at 01:20 UTC on 5 September and the site went four hours without
    # a scrape, because the next cron slot was two hours away and GitHub
    # dropped it.
    #
    # Twice an hour costs a cancelled loop run now and then. Four-hour holes
    # cost readers.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
    # 18:09 UTC, on its own line, so the job can recognise it: that is the one
    # run a day that rescrapes the whole week. It has to be a cron string
    # nothing else uses, because github.event.schedule reports the pattern that
    # fired and "7 * * * *" fires at 18:07 too - which would make the nightly
    # full pass indistinguishable from an ordinary hourly one. Changing the
    # hourly slots to "7 * * * *" without this line silently dropped the weekly
    # rescrape, and nothing would have failed to say so.
    - cron: "9 18 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "Days back to scrape. Blank = today during the day, 7 at night."
        required: false
        default: ""
      max_summaries:
        description: "Cap on AI calls (0 = summarise every relevant filing)"
        required: false
        default: "0"
      loop_seconds:
        description: "How long to keep scraping. Blank = 5h20m. 1 = one pass, then hand over."
        required: false
        default: ""

concurrency:
  group: scrape
  # A newer run replaces an older one now, rather than queueing behind it.
  # With a five-hour loop, queueing would mean a run waiting hours to start on
  # stale code - which is exactly what happened on 1 September. Nothing is lost
  # by cancelling: every pass publishes on its own, and the cache is saved
  # whatever happens.
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 320 minutes for a top-up, because it now lives for five hours refreshing
    # every half hour. 40 for a full 7-day pass, however it was started - the
    # nightly cron, by hand, or the dispatch endpoint asking for days=7 - since
    # that does one sweep and exits.
    timeout-minutes: >-
      ${{ (github.event.schedule == '9 18 * * *'
           || github.event.inputs.days == '7') && 40 || 350 }}

    steps:
      # ref: main, not the commit this run was pinned to.
      #
      # GitHub records the SHA when a run is CREATED, not when it starts. A run
      # that waits in the queue - and with a concurrency group they often wait -
      # then checks out whatever main looked like when it was queued. On 1
      # September a pass sat queued 34 minutes while two fixes were pushed, then
      # ran the code from before them and republished the very tags those fixes
      # were meant to correct. It looked exactly like the fixes had not worked.
      #
      # This job scrapes and republishes; it is not a build whose output has to
      # match a particular commit. It should always run the newest rules.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Say which code is actually running
        run: |
          echo "commit: $(git rev-parse --short HEAD)"
          echo "subject: $(git log -1 --pretty=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                    # shaves ~20s off every run

      - run: pip install --quiet -r requirements.txt

      # restore + save as separate steps, so the save can run `if: always()`.
      # actions/cache saves only when the job succeeded, so a run cut short -
      # by the timeout, by a failed verify, or by a newer run replacing it -
      # threw away every PDF it had read. It must hand its work on, or the same
      # documents get read over and over and no run ever gets ahead.
      - name: Restore summary and market-cap caches
        id: caches
        uses: actions/cache/restore@v4
        with:
          path: |
            cache.json
            mcap.json
            triage.json
          key: caches-${{ github.run_id }}
          restore-keys: caches-

      # Before anything is scraped, let alone published. These are guards on
      # the scoring rules, every one of them a mistake that reached the live
      # site once: a word that reads unambiguously in a headline turning out
      # to be ordinary English inside a PDF. If a rule change would mislabel
      # filings, the run stops here rather than putting it on the dashboard.
      - name: Check the scoring rules
        run: |
          python tests/test_rules.py
          python tests/test_insider.py
          python tests/test_deals.py

      - name: Decide how much to scrape
        id: plan
        run: |
          # --days N counts BACK from today, so it covers N+1 days: --days 0 is
          # today alone. The top-up passed 1 for a long time under a comment
          # saying it scraped only today, and was doing twice the work.
          #
          # The dispatch input defaults to blank on purpose. It used to default
          # to "7", so every dispatch - including the cron endpoint's - ran a
          # full week's rescrape instead of a top-up.
          #
          # The full pass is ONE named cron slot, not "any run after 18:00 UTC":
          # at a run every half hour that test would have started twelve
          # twenty-minute passes a night.
          if [ -n "${{ github.event.inputs.days }}" ]; then
            DAYS="${{ github.event.inputs.days }}"          # asked for explicitly
          elif [ "${{ github.event.schedule }}" = "9 18 * * *" ]; then
            DAYS=7                                          # the nightly full pass
          else
            DAYS=0                                          # top-up: today only
          fi
          # How long this run keeps scraping for. The nightly full pass does
          # one sweep and stops; a top-up stays alive and refreshes every half
          # hour, so one successful trigger covers a whole afternoon.
          if [ -n "${{ github.event.inputs.loop_seconds }}" ]; then
            LOOP="${{ github.event.inputs.loop_seconds }}"   # for testing
          elif [ "$DAYS" = "7" ]; then
            LOOP=0
          else
            LOOP=19200        # five hours twenty, inside the 6h job ceiling
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "loop_until=$LOOP" >> "$GITHUB_OUTPUT"
          echo "Scraping $DAYS day(s); loop for ${LOOP}s"

      # One run, many scrapes.
      #
      # GitHub's schedule event is best effort and drops runs under load. On 2
      # September it created 8 of the 34 this cron asked for - an average gap
      # of 144 minutes against the 30 requested, the worst 189. Every run that
      # did fire finished normally in a few minutes; the problem was never the
      # work, it was that the runs did not exist.
      #
      # So a run no longer scrapes once and stop. It scrapes, waits for the
      # next half hour, and scrapes again, for as long as it is allowed to
      # live. Whenever GitHub does manage to start one, the site then refreshes
      # every 30 minutes for hours - and the cron only has to succeed
      # occasionally rather than 48 times a day.
      #
      # A failed pass does not end the loop: the next half hour comes round
      # anyway, and each pass publishes on its own. The full nightly pass runs
      # once and exits, because it takes twenty minutes and nothing is waiting.
      - name: Scrape, summarise and publish
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DAYS: ${{ steps.plan.outputs.days }}
          MAX_SUMMARIES: ${{ github.event.inputs.max_summaries || 0 }}
          LOOP_UNTIL: ${{ steps.plan.outputs.loop_until }}
        run: |
          set +e
          scrape() {
            python -u publish.py --days "$DAYS"               --max-summaries "$MAX_SUMMARIES" --workers 8 --read-workers 32
            echo "pass exited $?"
          }

          scrape
          [ "$LOOP_UNTIL" = "0" ] && exit 0

          END=$(( $(date -u +%s) + LOOP_UNTIL ))
          while [ "$(date -u +%s)" -lt "$END" ]; do
            NOW=$(date -u +%s)
            WAIT=$(( 1800 - (NOW % 1800) ))
            echo "--- next pass in $((WAIT / 60))m$((WAIT % 60))s ---"
            sleep "$WAIT"
            [ "$(date -u +%s)" -ge "$END" ] && break
            echo "=== $(date -u +%H:%M)Z ==="
            scrape
          done
          echo "loop finished"
          exit 0



      # Every bug that reached the dashboard so far would have been caught here.
      # If this fails the run goes red, so a broken dashboard is visible in the
      # Actions tab instead of being found by someone using the site.
      - name: Verify the live site
        run: python tools/verify_live.py

      # Ask every category to justify itself, on the data this run just
      # published. Categories have always been fixed after a reader spotted
      # something absurd; this is the same question asked by the run, half an
      # hour after the rules changed, instead of by the reader a day later.
      #
      # The threshold is deliberately loose. It is not here to police wording -
      # a real order win described as "bagged a mandate" matches nothing the
      # audit knows. It is here to catch a category coming apart: every fault
      # found by hand on 3 September sat at 25% or worse, and every healthy
      # category sat under 15%.
      #
      # continue-on-error, because a bad category is a reason to look, not a
      # reason to throw away a good scrape. The step goes yellow in the Actions
      # tab and the run carries on.
      - name: Ask every category to justify itself
        continue-on-error: true
        run: python tools/audit_categories.py --worst 2 --fail-over 25

      # And check nothing was missed, against a source we do not control.
      #
      # The scraper reads BSE's and NSE's JSON APIs. Nothing inside the
      # pipeline can tell when one of those quietly returns a short page - it
      # has no idea what it did not see. Both exchanges publish the same
      # announcements as RSS, built by a different part of their systems, so
      # that is the independent witness.
      #
      # This is what found that a quarter of NSE's announcements were never
      # being fetched: the code asked for the "equities" list and there are
      # five of them.
      #
      # The tolerance is loose. BSE's feed carries mutual fund NAVs, commercial
      # paper redemptions and filings by unlisted private companies, none of
      # which this product wants - about sixty a day that will always show as
      # "not fetched". A jump well past that is the signal.
      - name: Check nothing was missed
        continue-on-error: true
        run: python tools/reconcile_feeds.py --show 10 --fail-over 120

      # Who inside a company is buying or selling its shares.
      #
      # Runs on every pass, not once a day, because NSE's feed holds only what
      # has been filed so far today and empties overnight: a pass at eleven in
      # the morning sees less than one at six in the evening. Each pass merges
      # what it finds into the day already stored rather than replacing it, so
      # the morning's trades survive the afternoon.
      #
      # continue-on-error: an exchange serving broken XML is a reason to have
      # no insider trades this pass, not to throw away a good scrape.
      - name: Read the day's insider trades
        if: always()
        continue-on-error: true
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          python -u publish_insider.py --backfill 7
          python -u publish_insider.py --from-filings 7

      # The large trades the exchanges publish by name.
      #
      # NSE answers for a date range, so seven days come back in one request.
      # BSE hands over its latest trading day only, whatever dates it is
      # asked for - so BSE history exists only because every pass keeps what
      # the last one found, and a pass that finds nothing writes nothing.
      #
      # continue-on-error for the same reason as the step above: an exchange
      # being unreachable is a reason to have no deals this pass, not to
      # throw away a good scrape.
      - name: Read the bulk and block deals
        if: always()
        continue-on-error: true
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          python -u publish_deals.py --days 7

      # Make sure today's morning brief exists.
      #
      # This lives here because this workflow is the thing that actually runs
      # every half hour - it dispatches its own successor, and the Actions tab
      # proves it. The same check was written into the website's
      # /api/cron/scrape route on 4 September and has never run once: that
      # route needs CRON_SECRET and GITHUB_DISPATCH_TOKEN, neither of which is
      # set on the Vercel project, so it answers 503 to every caller.
      #
      # Uses the machinery that works rather than the machinery that was
      # supposed to. Never fails the run: a missing brief is a reason to start
      # one, not to throw away a good scrape.
      - name: Make sure today's brief is out
        if: always()
        continue-on-error: true
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python tools/ensure_brief.py

      # Tell readers about filings by the companies they follow.
      #
      # After publishing, because it reads what was published - the alert run
      # pulls the summarised filings back out of the store rather than being
      # handed them, so the scrape does not need to know who is watching what.
      #
      # Same reasoning as the brief step above: this workflow is the thing
      # that actually runs, so it is the thing that triggers the alerts. And
      # the same rule - never fails the run. A reader not getting a Telegram
      # message is a bad evening; a thrown-away scrape is a bad week.
      #
      # Sending nothing twice is the route's own job: it keeps the ids it has
      # already sent on each reader's record, which is what makes it safe for
      # this to fire on all forty-eight runs a day.
      - name: Send portfolio alerts
        if: always()
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set - skipping portfolio alerts."
            exit 0
          fi
          site="${SITE_URL:-https://www.markettide.in}"
          code=$(curl -sS -m 120 -o /tmp/alerts.json -w "%{http_code}" \
            -H "x-cron-key: $CRON_SECRET" "$site/api/cron/alerts")
          echo "HTTP $code"
          cat /tmp/alerts.json || true
          echo

      - name: Keep the caches for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache.json
            mcap.json
            triage.json
          key: caches-${{ github.run_id }}

      # Hand over to the next run - LAST, after the cache is saved.
      #
      # Order matters here. cancel-in-progress is true, so the run this
      # dispatches will cancel this one the moment it starts. Dispatching
      # before the cache save would kill the save and throw away every PDF
      # this run read.
      #
      # The loop covers five hours and twenty minutes. That is only enough if
      # GitHub starts a run at least that often, and it does not: on 2
      # September it managed eight all day, the longest silence 189 minutes.
      # Close, but a run of bad luck would still leave a hole.
      #
      # So each run starts its successor. The cron becomes a safety net rather
      # than the mechanism - if a run dies before reaching this step, the next
      # scheduled trigger picks the chain back up.
      #
      # GITHUB_TOKEN deliberately cannot do this: GitHub blocks it from
      # triggering workflows, to stop a workflow looping for ever by accident.
      # That is exactly what we want here, so it needs a token of its own.
      # Without the secret this step does nothing and says so, and the cron
      # carries on alone.
      - name: Start the next run
        # success() || failure(), NOT always(): always() includes cancelled,
        # and a cancelled run must not start a successor. cancel-in-progress
        # means a run is cancelled precisely because a newer one is taking
        # over, so handing over as well produces a cancel-dispatch-cancel
        # loop - which is what happened at 18:37 on 2 September, three runs
        # in twenty-five seconds each killing the last.
        #
        # A run that finished its loop hands over. A run that crashed hands
        # over too, so a bad pass does not break the chain. A run that was
        # replaced does not, because its replacement is already running.
        if: (success() || failure()) && steps.plan.outputs.loop_until != '0'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "No DISPATCH_TOKEN secret, so the chain stops here."
            echo "Add one and this workflow keeps itself running for ever."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out -w "%{http_code}" -X POST             -H "Authorization: Bearer $DISPATCH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scrape.yml/dispatches"             -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "next run dispatched"
          else
            echo "could not dispatch the next run (HTTP $code):"
            head -c 300 /tmp/out
            echo
            echo "the cron will pick it up instead"
          fi
