name: The morning brief

# 07:30 IST every day. IST is UTC+5:30, so that is 02:00 UTC.
#
# The issue covers everything filed from the start of yesterday up to 06:45
# that morning. The 45 minutes between the cutoff and the send give the 06:30
# scrape time to land, so an announcement made overnight is in the brief the
# same morning instead of waiting a day.

on:
  # Vercel Cron owns the clock. This workflow is now only the PDF worker that
  # Vercel dispatches, so GitHub's best-effort scheduler cannot make it late.
  workflow_dispatch:
    inputs:
      day:
        description: "Issue date (YYYY-MM-DD). Blank means today."
        required: false
      count:
        description: "How many filings in the brief"
        required: false
        default: "50"
      publish:
        description: "Put it on the site (uncheck to just build and download it)"
        type: boolean
        required: false
        default: true

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ref: main - see the note in scrape.yml. A run pinned to the commit it
      # was queued at will happily build yesterday's newsletter with yesterday's
      # code.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      # The runner image ships Google Chrome. The brief is printed by it
      # rather than a Python PDF library, because the layout is CSS and only
      # a browser renders CSS the way a browser renders CSS.
      - name: Check Chrome is here
        run: google-chrome --version

      # Dead code, kept deliberately and marked as such.
      #
      # This guarded against five scheduled slots aiming at the same issue.
      # Those slots are gone - Vercel Cron owns the clock now and this workflow
      # is only the PDF worker - so github.event_name is always
      # workflow_dispatch and this step can never run.
      #
      # It stays because a dispatch cannot be told apart from a manual one, so
      # if duplicate builds ever become a problem the guard is here to switch
      # on. Rebuilding is harmless in the meantime: newsletter.py replaces the
      # day rather than adding to it.
      - name: Is today's issue already out?
        id: check
        if: github.event_name == 'schedule'
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, sys, urllib.request
          ist = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=5, minutes=30)
          today = ist.strftime("%Y-%m-%d")
          newest = None
          try:
              req = urllib.request.Request(
                  os.environ["KV_REST_API_URL"],
                  data=json.dumps(["GET", "mt:brief:index"]).encode(),
                  headers={"Authorization": "Bearer " + os.environ["KV_REST_API_TOKEN"],
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = json.load(r).get("result")
              days = json.loads(raw) if raw else []
              newest = days[0] if days else None
          except Exception as e:
              # stderr, not stdout: stdout is $GITHUB_OUTPUT and it takes
              # key=value lines only. A note written there is a malformed
              # output, and the safest failure is to build.
              print(f"could not read the index: {e}", file=sys.stderr)
          print(f"done={'yes' if newest == today else 'no'}")
          PY

      - name: Build the brief
        if: steps.check.outputs.done != 'yes'
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          NEWSLETTER_DELIVERY: substack
        run: >-
          python -u newsletter.py
          ${{ github.event.inputs.day && format('--day {0}', github.event.inputs.day) || '' }}
          --count "${{ github.event.inputs.count || 50 }}"
          ${{ github.event.inputs.publish == 'false' && ' ' || '--publish' }}

      # Kept so a morning's issue can still be downloaded from the Actions tab
      # if the site is having a bad day.
      - name: Keep a copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief
          path: brief/*.pdf
          retention-days: 14
          if-no-files-found: warn
